version: "13.0"
description: Baseline workspace guidance for repositories created from this template.
directives:
  - id: E-20.0
    dos:
      - Use the workspace for role-specific decisions, coordination, and
        guidance.
      - Define role boundaries and link to shared requirements and
        procedures in their owning repositories.
      - Store each workspace-owned procedure as a separate .yaml runbook under
        runbooks/ and link it from runbooks/README.md.
      - Validate each runbook against the shared v13 runbook schema.
    donts:
      - Keep template identity and placeholder content out of a derived
        workspace.
      - Do not duplicate shared conventions or company-wide procedures.
