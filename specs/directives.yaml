version: "11.0"
description: Baseline workspace guidance for repositories created from this template.
directives:
  - id: E-20
    dos:
      - Use the workspace for role-specific decisions, coordination, and
        guidance.
      - Keep role boundaries clear and link to shared requirements and
        procedures in their owning repositories.
      - Store each workspace-owned procedure as a separate JSON runbook indexed
        in runbooks/README.md.
    donts:
      - Do not leave template-specific identity or placeholder content in a
        derived workspace.
      - Do not duplicate shared conventions or company-wide procedures.
